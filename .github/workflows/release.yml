name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarm: ''
            suffix: linux_amd64
          - arch: arm64
            goarm: ''
            suffix: linux_arm64
          - arch: arm
            goarm: '7'
            suffix: linux_armv7
          - arch: '386'
            goarm: ''
            suffix: linux_386
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X subsoil/internal/model.Version=${version}" \
            -o "dist/subsoil_${version}_${{ matrix.suffix }}" ./cmd/subsoil

      - uses: actions/upload-artifact@v4
        with:
          name: subsoil-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum subsoil_* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/subsoil_*
            dist/SHA256SUMS
