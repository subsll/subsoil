name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -race ./...

      - name: Static build
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-s -w" -o /tmp/subsoil ./cmd/subsoil
          /tmp/subsoil version
